<body dir="rtl" class=" bg-body ">

<div class="login-page">



    <!-- بخش فرم -->
    <div class="login-section">

        <div class="login-box">

            <div class=""><img src="./assest/New folder//title.png" alt=""></div>

     
            <p class="description">
                برای ادامه شماره موبایل خود را وارد نمایید.
            </p>

            <form id="loginForm">

                <label for="phone">شماره موبایل</label>

                <div class="input-box">
                    <input
                        type="tel"
                        id="phone"
                        placeholder="مثال: 09123456789"
                        maxlength="11"
                    >
                </div>

                <button class="root" type="button">
                    دریافت کد تأیید
                </button>

                <p id="message"></p>

            </form>

        </div>

    </div>
    <!-- بخش تصویر -->

    <img class="doctor-image"
         src="https://uploadkon.ir/uploads/884807_26unsplash-IJ0KiXl4uys.png"
         alt="">

        <img src="./assest/New folder/1 (3).png" alt="">
    </div>

        <img src="./assest/New folder/2 (2).png" alt="">
    </div>

    <div class="c03">
        <img src="./assest/New folder/3 (2).png" alt="">

</div>
